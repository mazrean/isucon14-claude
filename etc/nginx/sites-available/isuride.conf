upstream app {
  server 127.0.0.1:8080;
  keepalive 256;
  keepalive_requests 100000;
  keepalive_timeout 120s;
}

server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は自己署名です
  ssl_certificate     /etc/nginx/tls/dummy.crt;
  ssl_certificate_key /etc/nginx/tls/dummy.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2;
  http2_max_concurrent_streams 1024;
  server_name xiv.isucon.net;
  server_name *.xiv.isucon.net;

  ssl_certificate     /etc/nginx/tls/_.xiv.isucon.net.crt;
  ssl_certificate_key /etc/nginx/tls/_.xiv.isucon.net.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  # proxy settings inherited by every location below (do NOT add
  # proxy_set_header inside a location, or these are lost there)
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    gzip_static on;
    expires max;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /images/ {
    # ベンチの isucandar はユーザーごとにキャッシュ本体を保持し、ベンチノードのメモリ (8G) を圧迫する。
    # 画像は no-store にしてキャッシュさせない (非圧縮で返し、展開コストも掛けさせない)
    gzip_static off;
    etag off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://app;
  }

  # SSE endpoints: no buffering, long-lived
  location /api/app/notification {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_pass http://app;
  }

  location /api/chair/notification {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_pass http://app;
  }

  location /api/internal/ {
    # localhostからのみアクセスを許可
    allow 127.0.0.1;
    deny all;
    proxy_pass http://app;
  }
}
