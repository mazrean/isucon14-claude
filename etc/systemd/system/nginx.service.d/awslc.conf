# AWS-LC でビルドした nginx 1.28 (scripts/build-nginx-awslc.sh) を使う
[Service]
ExecStartPre=
ExecStartPre=/usr/local/sbin/nginx-awslc -t -q -g 'daemon on; master_process on;'
ExecStart=
ExecStart=/usr/local/sbin/nginx-awslc -g 'daemon on; master_process on;'
ExecReload=
ExecReload=/usr/local/sbin/nginx-awslc -g 'daemon on; master_process on;' -s reload
